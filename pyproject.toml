[project]
name = "pdf-persistence"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Braian Rojas", email = "ciberseguridad277@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "motor>=3.7.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymupdf4llm>=1.28.2",
    "python-multipart>=0.0.32",
    "redis>=5.0.0",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
pdf-persistence = "pdf_persistence:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.ruff.lint]
extend-ignore = ["B008"]
